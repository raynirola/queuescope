name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Redis and expose Node to the test host
        run: |
          brew install redis
          echo "BULLMQ_NODE_PATH=$(command -v node)" >> "$GITHUB_ENV"
          echo "REDIS_SERVER_PATH=$(command -v redis-server)" >> "$GITHUB_ENV"
      - name: Build and test without developer credentials
        run: >-
          xcodebuild -project BullMQDashboard.xcodeproj
          -scheme BullMQDashboard -configuration Debug
          -destination 'platform=macOS'
          DEVELOPMENT_TEAM='' CODE_SIGN_IDENTITY=- ENABLE_HARDENED_RUNTIME=NO
          test
      - name: Test BullMQ mutations against isolated Redis
        run: |
          npm ci --prefix BullMQActionBridge
          npm test --prefix BullMQActionBridge
