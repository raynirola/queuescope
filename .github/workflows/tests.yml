name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test release helpers and shell syntax
        run: |
          python3 -B -m unittest discover -s tests/release -v
          for script in scripts/*.sh scripts/release/*.sh; do bash -n "$script"; done
      - name: Lint workflow syntax with pinned actionlint
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install adapter workspaces
        run: npm ci --ignore-scripts
      - name: Test adapters and published package contents
        run: |
          npm test
          npm run test:packages
      - name: Verify standalone app bridge packaging
        run: node --test tests/packaging/bridge.test.mjs

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Redis and expose Node to the test host
        run: |
          brew install redis
          echo "BULLMQ_NODE_PATH=$(command -v node)" >> "$GITHUB_ENV"
          echo "REDIS_SERVER_PATH=$(command -v redis-server)" >> "$GITHUB_ENV"
      - name: Build and test without developer credentials
        run: >-
          xcodebuild -project BullMQDashboard.xcodeproj
          -scheme BullMQDashboard -configuration Debug
          -destination 'platform=macOS'
          DEVELOPMENT_TEAM='' CODE_SIGN_IDENTITY=- ENABLE_HARDENED_RUNTIME=NO
          test
      - name: Test BullMQ mutations against isolated Redis
        run: |
          npm ci --omit=optional --ignore-scripts --prefix packages/action-bridge --workspaces=false
          npm test --prefix packages/action-bridge --workspaces=false

  distribution:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate current public cask without release credentials or publication
        env:
          BREW_READONLY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts/release")
          from publish_distribution import validate_brew_cask
          validate_brew_cask(Path("distribution/Casks/queuescope.rb").read_text())
          PY
